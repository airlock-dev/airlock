pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      glob: "src/**/*.ts"
      run: npx eslint --max-warnings 0 {staged_files}
    format:
      glob: "**/*.{ts,js,md,yaml,yml}"
      run: npx prettier --check {staged_files}
    secrets:
      run: gitleaks protect --staged --no-banner
