services:
  airlock-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: airlock-bot:local
    command: gateway --config /config/airlock.yaml
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRLOCK_CONFIG: /config/airlock.yaml
      AIRLOCK_HEALTH_PORT: '4113'
    volumes:
      # Runtime gateway can hot-reload this file but cannot modify policy.
      - ./airlock-config:/config:ro
      - airlock-data:/data
      # Keep npx-installed MCP servers cached across restarts.
      - airlock-npm-cache:/home/airlock/.npm
    ports:
      # Bind to loopback by default. Put your TLS/auth proxy on the same host,
      # or change these bindings only for a trusted private network.
      - 127.0.0.1:4111:4111
      - 127.0.0.1:4113:4113
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Add reverse-proxy labels or service discovery metadata here if your
    # platform uses container labels.

  airlock-dashboard:
    image: airlock-bot:local
    command: dashboard --config /config/airlock.yaml --host 0.0.0.0 --port 4112 --gateway-url http://airlock-gateway:4113
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIRLOCK_CONFIG: /config/airlock.yaml
      AIRLOCK_GATEWAY_SECRET: ${MANAGEMENT_API_SECRET}
      AIRLOCK_HEALTH_PORT: '4112'
    volumes:
      # Dashboard owns config mutation and writes /config/airlock.bak.
      - ./airlock-config:/config
    ports:
      - 127.0.0.1:4112:4112
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - airlock-gateway
    # Add dashboard-specific reverse-proxy labels here. Protect this route with
    # human authentication.

volumes:
  airlock-data:
  airlock-npm-cache:
