name: Companion Release

on:
  push:
    tags: ['companion-v*']

permissions:
  contents: write

jobs:
  build-sign-notarize:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos-companion
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build
        run: swift build -c release

      - name: Generate app icon
        run: swift scripts/generate-icon.swift AirlockCompanion

      - name: Create .app bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          APP_DIR=.build/AirlockCompanion.app
          CONTENTS=$APP_DIR/Contents
          MACOS=$CONTENTS/MacOS
          RESOURCES=$CONTENTS/Resources
          APP_VERSION=${VERSION#companion-v}

          rm -rf "$APP_DIR"
          mkdir -p "$MACOS" "$RESOURCES"

          cp .build/arm64-apple-macosx/release/AirlockCompanion "$MACOS/AirlockCompanion"
          cp AirlockCompanion/AppIcon.icns "$RESOURCES/AppIcon.icns"

          # Copy SPM resource bundles (e.g. HighlighterSwift)
          for bundle in .build/arm64-apple-macosx/release/*.bundle; do
            [ -d "$bundle" ] && cp -R "$bundle" "$RESOURCES/"
          done

          cat > "$CONTENTS/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>AirlockCompanion</string>
              <key>CFBundleDisplayName</key>
              <string>Airlock Companion</string>
              <key>CFBundleIdentifier</key>
              <string>bot.airlock.companion</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>AirlockCompanion</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Sign app
        run: |
          codesign --force --deep --options runtime \
            --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" \
            --entitlements AirlockCompanion/Entitlements.plist \
            .build/AirlockCompanion.app

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create zip for notarization submission
          ditto -c -k --keepParent .build/AirlockCompanion.app .build/AirlockCompanion-notarize.zip

          xcrun notarytool submit .build/AirlockCompanion-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple .build/AirlockCompanion.app

      - name: Create DMG
        run: |
          DMG_DIR=$RUNNER_TEMP/dmg-staging
          mkdir -p "$DMG_DIR"

          # Copy app into staging
          cp -R .build/AirlockCompanion.app "$DMG_DIR/"

          # Create symlink to Applications
          ln -s /Applications "$DMG_DIR/Applications"

          # Create DMG
          hdiutil create -volname "Airlock Companion" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            .build/AirlockCompanion.dmg

          # Sign the DMG too
          codesign --force --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" \
            .build/AirlockCompanion.dmg

      - name: Create zip archive
        run: |
          cd .build
          ditto -c -k --keepParent AirlockCompanion.app AirlockCompanion.zip

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION=${VERSION#companion-v}
          gh release create "$VERSION" \
            --title "Airlock Companion v$APP_VERSION" \
            --notes "macOS companion app for Airlock HITL approvals.

          **Install:**
          - **DMG** (recommended): Download \`AirlockCompanion.dmg\`, open, drag to Applications
          - **Zip**: Download \`AirlockCompanion.zip\`, unzip, move to Applications
          - **Homebrew**: \`brew install airlock-dev/tap/airlock-companion\`

          Requires macOS 14+." \
            .build/AirlockCompanion.dmg \
            .build/AirlockCompanion.zip

      - name: Generate app token for tap repo
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Update Homebrew tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION=${VERSION#companion-v}
          SHA256=$(shasum -a 256 .build/AirlockCompanion.zip | awk '{print $1}')

          # Clone tap repo using the release bot app token
          cd $RUNNER_TEMP
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/airlock-dev/homebrew-tap.git
          cd homebrew-tap

          # Update cask
          cat > Casks/airlock-companion.rb << CASK
          cask "airlock-companion" do
            version "${APP_VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/airlock-dev/airlock/releases/download/companion-v#{version}/AirlockCompanion.zip"
            name "Airlock Companion"
            desc "macOS menu bar companion for Airlock HITL approvals"
            homepage "https://airlock.bot"

            depends_on macos: ">= :sonoma"

            app "AirlockCompanion.app"

            zap trash: [
              "~/Library/Preferences/bot.airlock.companion.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/airlock-companion.rb
          git commit -m "Update airlock-companion to v${APP_VERSION}"
          git push
