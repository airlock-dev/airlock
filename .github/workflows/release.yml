name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Wait for npm version to become visible
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if curl -fsSL "https://registry.npmjs.org/airlock-bot/${VERSION}" >/dev/null 2>&1; then
              echo "airlock-bot@${VERSION} is live on npm"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for airlock-bot@${VERSION} on npm"
          exit 1

      - name: Authenticate via GitHub OIDC and publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
